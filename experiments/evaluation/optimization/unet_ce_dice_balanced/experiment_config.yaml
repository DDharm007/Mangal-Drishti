experiment_name: unet_ce_dice_balanced
model_name: unet
initialized_from: experiments/unet/best_model.pth
epochs: 4
lr: 3.0e-05
weight_decay: 0.0001
dice_weight: 0.5
loss: CombinedCEDiceLoss(tempered_weights + 0.5 * SoftDiceLoss)
class_weights:
  '0': 0.65
  '1': 0.65
  '2': 3.8
  '3': 7.0
selection_split: val_only
selection_criterion: val_mIoU
hardware:
  device: cuda
  gpu_name: NVIDIA GeForce RTX 3050 A Laptop GPU
  vram_gb: 4.0
  ram_gb: 15.64
  pytorch_version: 2.11.0+cu128
  amp_enabled: true
  batch_size: 4
  grad_accum_steps: 2
  effective_batch_size: 8
  model_name: unet
